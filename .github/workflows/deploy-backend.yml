name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/riadsab/alumni-connect-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the runner's Docker daemon for the Postgres integration test.
      - name: Run tests
        run: ./mvnw -B test
        working-directory: ./server

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Key is locked to /home/deploy/deploy.sh via authorized_keys
          # (restrict,command=...), so sshd runs that and ignores this line.
          script: /home/deploy/deploy.sh
