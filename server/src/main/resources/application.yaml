spring:
  application:
    name: alumni-connect
  datasource:
    url: jdbc:postgresql://localhost:5432/alumni_connect
    username: alumni
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 3600000
  issuer: alumni-connect

