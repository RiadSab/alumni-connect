spring:
  application:
    name: alumni-connect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alumni_connect}
    username: ${DB_USERNAME:alumni}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Without these a stalled SMTP connection hangs the request that triggered the mail.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 900000
  issuer: alumni-connect

storage:
  local:
    dir: ${STORAGE_DIR:./uploads}

app:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:noreply@example.com}
  auth:
    cookie-secure: ${COOKIE_SECURE:true} # set false for local http dev
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

