spring:
  application:
    name: alumni-connect
  datasource:
    url: jdbc:postgresql://localhost:5432/alumni_fresh
    username: alumni
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema now; Hibernate only checks entities match it (never edits).
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    # The existing DB already has the schema, so baseline it at V1 (skip running V1 there) and
    # apply V2+ onward. A fresh empty DB has nothing to baseline, so it runs V1 and builds it.
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 3600000
  issuer: alumni-connect

# Local filesystem storage backend (LocalStorageService). Override STORAGE_DIR in prod, or swap
# the StorageService implementation entirely (e.g. S3) without touching this beyond the path.
storage:
  local:
    dir: ${STORAGE_DIR:./uploads}

# Outbound email. provider=log (default) uses LoggingEmailSender; set MAIL_PROVIDER=smtp to send
# via spring.mail.* (Resend). MAIL_FROM must be an address on the verified domain.
app:
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:noreply@example.com}

