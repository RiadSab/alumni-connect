spring:
  application:
    name: alumni-connect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alumni_connect}
    username: ${DB_USERNAME:alumni}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Without these a stalled SMTP connection hangs the request that triggered the mail.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 900000
  issuer: alumni-connect

storage:
  local:
    dir: ${STORAGE_DIR:./uploads}

app:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:noreply@example.com}
  # Base URL of the client, used to build links in outgoing email.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Timezone interview times are written in when emailed.
  timezone: ${APP_TIMEZONE:Africa/Casablanca}
  mentoring:
    # Per student, per semester. The supply is volunteers, so it is deliberately small.
    bookings-per-semester: ${MENTORING_BOOKINGS_PER_SEMESTER:3}
    default-slot-minutes: 20
  auth:
    cookie-secure: ${COOKIE_SECURE:true} # set false for local http dev
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}


  # Local token buckets. These are starting budgets, not measured traffic guarantees.
  # Each refill progressively restores capacity; all values can be overridden by environment.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    maximum-bucket-entries: ${RATE_LIMIT_MAXIMUM_BUCKET_ENTRIES:10000}
    bucket-idle-lifetime: ${RATE_LIMIT_BUCKET_IDLE_LIFETIME:2h}
    policies:
      source-default:
        capacity: ${RATE_LIMIT_SOURCE_DEFAULT_CAPACITY:120}
        refill-period: ${RATE_LIMIT_SOURCE_DEFAULT_REFILL_PERIOD:1m}
      source-public-read:
        capacity: ${RATE_LIMIT_SOURCE_PUBLIC_READ_CAPACITY:60}
        refill-period: ${RATE_LIMIT_SOURCE_PUBLIC_READ_REFILL_PERIOD:1m}
      source-login:
        capacity: ${RATE_LIMIT_SOURCE_LOGIN_CAPACITY:10}
        refill-period: ${RATE_LIMIT_SOURCE_LOGIN_REFILL_PERIOD:1m}
      source-registration:
        capacity: ${RATE_LIMIT_SOURCE_REGISTRATION_CAPACITY:5}
        refill-period: ${RATE_LIMIT_SOURCE_REGISTRATION_REFILL_PERIOD:1h}
      source-forgot-password:
        capacity: ${RATE_LIMIT_SOURCE_FORGOT_PASSWORD_CAPACITY:5}
        refill-period: ${RATE_LIMIT_SOURCE_FORGOT_PASSWORD_REFILL_PERIOD:1h}
      source-reset-password:
        capacity: ${RATE_LIMIT_SOURCE_RESET_PASSWORD_CAPACITY:10}
        refill-period: ${RATE_LIMIT_SOURCE_RESET_PASSWORD_REFILL_PERIOD:1m}
      source-refresh:
        capacity: ${RATE_LIMIT_SOURCE_REFRESH_CAPACITY:20}
        refill-period: ${RATE_LIMIT_SOURCE_REFRESH_REFILL_PERIOD:1m}
      source-logout:
        capacity: ${RATE_LIMIT_SOURCE_LOGOUT_CAPACITY:60}
        refill-period: ${RATE_LIMIT_SOURCE_LOGOUT_REFILL_PERIOD:1m}
      source-confirmation:
        capacity: ${RATE_LIMIT_SOURCE_CONFIRMATION_CAPACITY:10}
        refill-period: ${RATE_LIMIT_SOURCE_CONFIRMATION_REFILL_PERIOD:1m}
      user-default:
        capacity: ${RATE_LIMIT_USER_DEFAULT_CAPACITY:120}
        refill-period: ${RATE_LIMIT_USER_DEFAULT_REFILL_PERIOD:1m}
      user-upload:
        capacity: ${RATE_LIMIT_USER_UPLOAD_CAPACITY:5}
        refill-period: ${RATE_LIMIT_USER_UPLOAD_REFILL_PERIOD:1m}
      user-change-password:
        capacity: ${RATE_LIMIT_USER_CHANGE_PASSWORD_CAPACITY:5}
        refill-period: ${RATE_LIMIT_USER_CHANGE_PASSWORD_REFILL_PERIOD:15m}
