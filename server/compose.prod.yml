services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: alumni_connect
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]

  app:
    image: ghcr.io/riadsab/alumni-connect-server:latest
    pull_policy: always
    restart: unless-stopped
    depends_on: [db]
    environment:
      # Only Caddy can reach the unpublished app port; use its sanitized client IP.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAXIMUM_BUCKET_ENTRIES: ${RATE_LIMIT_MAXIMUM_BUCKET_ENTRIES:-10000}
      RATE_LIMIT_BUCKET_IDLE_LIFETIME: ${RATE_LIMIT_BUCKET_IDLE_LIFETIME:-2h}
      RATE_LIMIT_SOURCE_DEFAULT_CAPACITY: ${RATE_LIMIT_SOURCE_DEFAULT_CAPACITY:-120}
      RATE_LIMIT_SOURCE_DEFAULT_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_DEFAULT_REFILL_PERIOD:-1m}
      RATE_LIMIT_SOURCE_PUBLIC_READ_CAPACITY: ${RATE_LIMIT_SOURCE_PUBLIC_READ_CAPACITY:-60}
      RATE_LIMIT_SOURCE_PUBLIC_READ_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_PUBLIC_READ_REFILL_PERIOD:-1m}
      RATE_LIMIT_SOURCE_LOGIN_CAPACITY: ${RATE_LIMIT_SOURCE_LOGIN_CAPACITY:-10}
      RATE_LIMIT_SOURCE_LOGIN_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_LOGIN_REFILL_PERIOD:-1m}
      RATE_LIMIT_SOURCE_REGISTRATION_CAPACITY: ${RATE_LIMIT_SOURCE_REGISTRATION_CAPACITY:-5}
      RATE_LIMIT_SOURCE_REGISTRATION_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_REGISTRATION_REFILL_PERIOD:-1h}
      RATE_LIMIT_SOURCE_FORGOT_PASSWORD_CAPACITY: ${RATE_LIMIT_SOURCE_FORGOT_PASSWORD_CAPACITY:-5}
      RATE_LIMIT_SOURCE_FORGOT_PASSWORD_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_FORGOT_PASSWORD_REFILL_PERIOD:-1h}
      RATE_LIMIT_SOURCE_RESET_PASSWORD_CAPACITY: ${RATE_LIMIT_SOURCE_RESET_PASSWORD_CAPACITY:-10}
      RATE_LIMIT_SOURCE_RESET_PASSWORD_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_RESET_PASSWORD_REFILL_PERIOD:-1m}
      RATE_LIMIT_SOURCE_REFRESH_CAPACITY: ${RATE_LIMIT_SOURCE_REFRESH_CAPACITY:-20}
      RATE_LIMIT_SOURCE_REFRESH_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_REFRESH_REFILL_PERIOD:-1m}
      RATE_LIMIT_SOURCE_LOGOUT_CAPACITY: ${RATE_LIMIT_SOURCE_LOGOUT_CAPACITY:-60}
      RATE_LIMIT_SOURCE_LOGOUT_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_LOGOUT_REFILL_PERIOD:-1m}
      RATE_LIMIT_SOURCE_CONFIRMATION_CAPACITY: ${RATE_LIMIT_SOURCE_CONFIRMATION_CAPACITY:-10}
      RATE_LIMIT_SOURCE_CONFIRMATION_REFILL_PERIOD: ${RATE_LIMIT_SOURCE_CONFIRMATION_REFILL_PERIOD:-1m}
      RATE_LIMIT_USER_DEFAULT_CAPACITY: ${RATE_LIMIT_USER_DEFAULT_CAPACITY:-120}
      RATE_LIMIT_USER_DEFAULT_REFILL_PERIOD: ${RATE_LIMIT_USER_DEFAULT_REFILL_PERIOD:-1m}
      RATE_LIMIT_USER_UPLOAD_CAPACITY: ${RATE_LIMIT_USER_UPLOAD_CAPACITY:-5}
      RATE_LIMIT_USER_UPLOAD_REFILL_PERIOD: ${RATE_LIMIT_USER_UPLOAD_REFILL_PERIOD:-1m}
      RATE_LIMIT_USER_CHANGE_PASSWORD_CAPACITY: ${RATE_LIMIT_USER_CHANGE_PASSWORD_CAPACITY:-5}
      RATE_LIMIT_USER_CHANGE_PASSWORD_REFILL_PERIOD: ${RATE_LIMIT_USER_CHANGE_PASSWORD_REFILL_PERIOD:-15m}
      DB_URL: jdbc:postgresql://db:5432/alumni_connect
      DB_USERNAME: alumni
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STORAGE_PROVIDER: r2
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      MAIL_PROVIDER: smtp
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
